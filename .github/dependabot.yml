version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  # v1 (Fiber v2) maintenance branch: security and patch updates only reach it
  # if Dependabot is told to target it.
  - package-ecosystem: gomod
    directory: /
    target-branch: v1
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies-v1:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: v1
    schedule:
      interval: weekly
    groups:
      github-actions-v1:
        patterns:
          - "*"
